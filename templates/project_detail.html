{% extends "base.html" %}
{% block content %}

<section class="page-header">
    <div class="container">
        <h1>{{ project.title }}</h1>
        <p class="lead">Detalle del proyecto</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <img src="{{ project.image_url if project.image_url else url_for('static', filename='images/project_placeholder.png') }}"
                     class="project-detail-image mb-4"
                     alt="{{ project.title }}">

                <div class="project-description card">
                    <div class="card-body">
                        <h3>Descripción del Proyecto</h3>
                        <p style="white-space: pre-wrap; color: var(--text-muted);">{{ project.description }}</p>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a href="{{ url_for('projects') }}" class="btn btn-outline-primary me-2">← Volver a Proyectos</a>
                    <a href="{{ url_for('contact') }}" class="btn btn-primary">Solicitar cotización</a>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
